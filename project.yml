name: Vaalbara
options:
  bundleIdPrefix: com.vaalbara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VaalbaraCore:
    path: Packages/VaalbaraCore
  VaalbaraEngine:
    path: Packages/VaalbaraEngine
  VaalbaraAudio:
    path: Packages/VaalbaraAudio
  VaalbaraNetworking:
    path: Packages/VaalbaraNetworking

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 1,2 = iPhone and iPad. Universal: one binary, one listing, the layout
    # adapts at runtime (see the tablet breakpoint in src/styles.css).
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Vaalbara:
    type: application
    platform: iOS
    sources:
      # Resources are listed below once. Including them under sources as well
      # makes XcodeGen emit every art file twice in Copy Bundle Resources,
      # which surfaces as ~95 "Multiple commands produce" build errors.
      - path: Vaalbara
        excludes:
          - Resources/**
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
          - Info.plist
          - "*.entitlements"
    resources:
      - path: Vaalbara/Assets.xcassets
      - path: Vaalbara/Resources/Art
        optional: true
        type: folder
      - path: Vaalbara/Resources/WebApp
        optional: true
        type: folder
      - path: Vaalbara/PrivacyInfo.xcprivacy
    dependencies:
      - package: VaalbaraCore
      - package: VaalbaraEngine
      - package: VaalbaraAudio
      - package: VaalbaraNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaalbara.thelastoasis
        INFOPLIST_FILE: Vaalbara/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: false
        SWIFT_EMIT_LOC_STRINGS: true
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.2.0
    entitlements:
      path: Vaalbara/Vaalbara.entitlements

schemes:
  Vaalbara:
    build:
      targets:
        Vaalbara: all
    run:
      config: Debug
    archive:
      config: Release
