name: Vaalbara
options:
  bundleIdPrefix: com.vaalbara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VaalbaraCore:
    path: Packages/VaalbaraCore
  VaalbaraEngine:
    path: Packages/VaalbaraEngine
  VaalbaraAudio:
    path: Packages/VaalbaraAudio
  VaalbaraNetworking:
    path: Packages/VaalbaraNetworking

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Vaalbara:
    type: application
    platform: iOS
    sources:
      - path: Vaalbara
    resources:
      - path: Vaalbara/Assets.xcassets
      - path: Vaalbara/Resources/Art
        optional: true
      - path: Vaalbara/Resources/WebApp
        optional: true
    dependencies:
      - package: VaalbaraCore
      - package: VaalbaraEngine
      - package: VaalbaraAudio
      - package: VaalbaraNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaalbara.thelastoasis
        INFOPLIST_FILE: Vaalbara/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    entitlements:
      path: Vaalbara/Vaalbara.entitlements

schemes:
  Vaalbara:
    build:
      targets:
        Vaalbara: all
    run:
      config: Debug
    archive:
      config: Release
